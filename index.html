<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123B7A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AKAIDO Sales System V3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:#f4f7fb;color:#172033;-webkit-text-size-adjust:100%}
h2{margin:6px 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
a{color:#123B7A}
.top{background:#123B7A;color:#fff;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0px));position:sticky;top:0;z-index:20}
.topin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 14px}
.userline{font-size:12px;opacity:.8;margin-top:2px}
.hbtn{border:1px solid #ffffff55;background:#ffffff1a;color:#fff;border-radius:8px;padding:7px 10px;font-size:12px}
.container{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 3px 12px #123b7a0d}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{padding:13px;border-radius:12px;background:#fff;border:1px solid #e3ebf7}
.stat b{display:block;font-size:22px;color:#123B7A;word-break:break-word}
.stat span{font-size:12px;color:#667085}
input,select,textarea{width:100%;padding:11px;border:1px solid #d6dbe5;border-radius:9px;margin-bottom:8px;font:inherit;font-size:16px;background:#fff}
textarea{min-height:85px}
label{display:block;font-size:12px;font-weight:700;color:#667085;margin-bottom:3px}
.btn{border:0;border-radius:9px;padding:11px 14px;background:#123B7A;color:#fff;font-weight:700;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6}
.secondary{background:#e8eef8;color:#123B7A}
.danger{background:#b42318;color:#fff}
.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.item{border:1px solid #e5e7eb;border-radius:11px;padding:11px;margin-top:8px}
.muted{color:#667085;font-size:13px}
.red{color:#b42318;font-weight:700}
.err{color:#b42318;font-size:13px;margin:8px 0 0}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#7a4b00;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.badge{display:inline-block;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800}
.g-A{background:#e8f7ee;color:#16834a}.g-B{background:#fff4d6;color:#a15c00}.g-C{background:#eee;color:#666}
.hidden{display:none!important}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;border:0;background:#fff;padding:9px 3px;font-size:11px;color:#667085}
.nav button.on{color:#123B7A;font-weight:800}
main{padding-bottom:90px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{width:100%;max-width:420px}
.logo{font-size:34px;font-weight:900;color:#123B7A}
.table{width:100%;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;white-space:nowrap}
td select{margin:0;padding:6px;font-size:13px;width:auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>

<div id="login" class="login">
 <div class="loginbox">
  <div class="logo">AKAIDO</div>
  <div class="muted" style="margin:5px 0 18px">SALES MANAGEMENT SYSTEM V3.0 · 云端版</div>
  <div class="card">
   <label for="lu">账号 Username</label>
   <input id="lu" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
   <label for="lp">密码 Password</label>
   <input id="lp" type="password" autocomplete="current-password">
   <button id="loginBtn" class="btn full" type="button" onclick="doLogin()">登录 LOGIN</button>
   <p id="loginMsg" class="err hidden"></p>
   <p class="muted">账号由管理员创建，不能自行注册。</p>
  </div>
 </div>
</div>

<div id="app" class="hidden">
 <header class="top">
  <div class="container topin" style="padding-top:0;padding-bottom:0">
   <div><b>AKAIDO SYSTEM</b><div id="userline" class="userline"></div></div>
   <div class="row"><button class="hbtn" type="button" onclick="refresh()">↻ 刷新</button><button class="hbtn" type="button" onclick="logout()">退出</button></div>
  </div>
 </header>
 <main class="container">
  <section id="dashboard"></section>
  <section id="checkin" class="hidden"></section>
  <section id="customers" class="hidden"></section>
  <section id="visits" class="hidden"></section>
  <section id="admin" class="hidden"></section>
  <section id="hr" class="hidden"></section>
 </main>
 <nav class="nav">
  <button data-p="dashboard" onclick="page('dashboard')">📊<br>首页</button>
  <button data-p="checkin" onclick="page('checkin')">📍<br>外勤</button>
  <button data-p="customers" onclick="page('customers')">👥<br>客户</button>
  <button data-p="visits" onclick="page('visits')">📝<br>拜访</button>
  <button data-p="hr" onclick="page('hr')">🕐<br>考勤</button>
  <button id="navAdmin" data-p="admin" onclick="page('admin')">⚙️<br>后台</button>
 </nav>
</div>
<div id="toast" class="toast"></div>
<div id="modal" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:60;overflow:auto;padding:14px"><div id="modalBox" class="card" style="max-width:480px;margin:20px auto"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ========== 配置 ========== */
const SUPABASE_URL='https://ukytgdqmhyfeaiecnacr.supabase.co';
const SUPABASE_KEY='sb_publishable_0xvYTyLvmtksPSKTh3-BAQ_rKE0I9RH';   // 公开密钥，可放在网页里；权限由数据库 RLS 控制
const EMAIL_DOMAIN='@akaido-sales.com';

/* ========== 全局状态与工具 ========== */
let sb=null, me=null, cur='dashboard', busy=false;
let D={profiles:[],customers:[],visits:[],attendance:[]};
const PAGES=['dashboard','checkin','customers','visits','admin','hr'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=x=>x?new Date(x).toLocaleString('en-MY',{hour12:false}):'-';
const ftime=x=>x?new Date(x).toLocaleTimeString('en-MY',{hour12:false,hour:'2-digit',minute:'2-digit'}):'-';
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const startOfToday=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
const isToday=x=>new Date(x).getTime()>=startOfToday();
const isAdmin=()=>!!me&&me.role==='admin';
const isStaff=()=>!!me&&me.role==='staff';   // Staff：默认只能使用考勤打卡
const staffCust=()=>isStaff()&&me.can_customers===true;   // 管理员给 Staff 开启的「客户」权限
const allowedPages=()=>isStaff()?(staffCust()?['hr','customers']:['hr']):PAGES;
let custErr='';
const nameOf=id=>{const p=D.profiles.find(x=>x.id===id);return p?p.name:'-'};
// 用于把文字安全地塞进 onclick="fn('...')" 这种单引号 JS 字符串里：先转义反斜杠和单引号，再做HTML转义
const jsAttr=s=>esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const custName=id=>{if(!id)return '';const c=D.customers.find(x=>x.id===id);return c?c.name:'（客户已删除）'};
const salesList=()=>D.profiles.filter(p=>p.role==='sales'&&p.active);
const mapLink=(lat,lng)=>(lat==null||lng==null)?'-':'<a target="_blank" rel="noopener" href="https://www.google.com/maps?q='+Number(lat)+','+Number(lng)+'">地图</a>';
const gpsText=(lat,lng)=>(lat==null||lng==null)?'-':Number(lat).toFixed(5)+', '+Number(lng).toFixed(5);

let toastTimer;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
async function guard(fn){
  if(busy)return;
  busy=true;
  try{await fn()}catch(e){console.error(e);toast('出错：'+((e&&e.message)?e.message:e))}
  finally{busy=false}
}
function loginMsg(t){const p=$('loginMsg');p.textContent=t||'';p.classList.toggle('hidden',!t)}

/* 潜在订单：每个客户只取「最近一次拜访」填写的金额，避免重复累加 */
function potMap(){const m=new Map();for(const v of D.visits){if(!m.has(v.customer_id))m.set(v.customer_id,Number(v.potential_order||0))}return m}
function potentialFor(ownerId){const m=potMap();let s=0;D.customers.forEach(c=>{if(!ownerId||c.owner_id===ownerId)s+=(m.get(c.id)||0)});return s}

/* ========== 登录 / 退出 ========== */
async function doLogin(){
  loginMsg('');
  if(!sb){loginMsg('无法加载网络组件，请检查网络后刷新页面');return}
  const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;
  if(!u||!p){loginMsg('请输入账号和密码');return}
  const btn=$('loginBtn');btn.disabled=true;btn.textContent='登录中…';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:u.includes('@')?u:u+EMAIL_DOMAIN,password:p});
    if(error){loginMsg(/invalid login/i.test(error.message)?'账号或密码错误':'登录失败：'+error.message);return}
    await enter(data.user);
  }catch(e){console.error(e);loginMsg('登录失败：'+(e.message||e))}
  finally{btn.disabled=false;btn.textContent='登录 LOGIN'}
}
async function enter(user){
  const {data:prof,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!prof){await sb.auth.signOut();loginMsg('找不到账号资料，请联系管理员');return}
  if(!prof.active){await sb.auth.signOut();loginMsg('此账号已停用，请联系管理员');return}
  me=prof;
  me.pwdChanged=!!(user.user_metadata&&user.user_metadata.pwd_changed);
  await loadAll();
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('userline').textContent=me.name+' · '+me.role.toUpperCase();
  applyNav();
  page(isStaff()?'hr':'dashboard');
}
function applyNav(){
  const allow=isStaff()?allowedPages():null;
  document.querySelectorAll('.nav button').forEach(b=>{
    if(b.id==='navAdmin'){b.classList.toggle('hidden',!isAdmin());return}
    b.classList.toggle('hidden',!!allow&&!allow.includes(b.dataset.p));
  });
}
async function logout(){me=null;try{await sb.auth.signOut()}catch(e){}location.reload()}
async function refresh(){await guard(async()=>{await loadAll();applyNav();page(cur);toast('已刷新')})}

/* ========== 读取数据（数据库 RLS 已按账号过滤：Sales 只会拿到自己的，Admin 拿到全部） ========== */
let cardUrls={};
const cardSrc=p=>p?(cardUrls[p]||null):null;
async function loadCardUrls(customers){
  const paths=[...new Set(customers.map(c=>c.card_photo).filter(Boolean))];
  if(!paths.length){cardUrls={};return}
  const {data,error}=await sb.storage.from('business-cards').createSignedUrls(paths,3600);
  const next={};
  if(!error&&data)data.forEach(d=>{if(d&&d.path&&d.signedUrl)next[d.path]=d.signedUrl});
  cardUrls=next;
}
async function loadAll(){
  if(isStaff()){   // Staff：不读拜访、外勤；只有被开启「客户」权限时才读自己的客户
    const pr=await sb.from('profiles').select('*').eq('id',me.id).single();   // 重新读取，管理员刚改的权限马上生效
    if(pr.data)Object.assign(me,pr.data);
    D={profiles:[me],customers:[],visits:[],attendance:[]};
    custErr='';
    if(staffCust()){
      const r=await sb.from('customers').select('*').order('created_at',{ascending:false});
      if(r.error)custErr=r.error.message||String(r.error);else D.customers=r.data;
      await loadCardUrls(D.customers);
    }
    await loadHR();
    return;
  }
  const rs=await Promise.all([
    sb.from('profiles').select('*').order('username'),
    sb.from('customers').select('*').order('created_at',{ascending:false}),
    sb.from('visits').select('*').order('created_at',{ascending:false}),
    sb.from('attendance').select('*').order('created_at',{ascending:false}).limit(1000)
  ]);
  for(const r of rs){if(r.error)throw r.error}
  D={profiles:rs[0].data,customers:rs[1].data,visits:rs[2].data,attendance:rs[3].data};
  await loadCardUrls(D.customers);
  await loadHR();
}

/* ========== 页面切换 ========== */
function showSection(p){
  cur=p;clearInterval(hrTimer);
  PAGES.forEach(x=>$(x).classList.toggle('hidden',x!==p));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  window.scrollTo(0,0);
}
function page(p){
  if(isStaff()&&!allowedPages().includes(p))p='hr';   // Staff 只能进被允许的页面
  showSection(p);
  ({dashboard:renderDashboard,checkin:renderCheckin,customers:renderCustomers,visits:renderVisits,admin:renderAdmin,hr:renderHR})[p]();
}

/* ========== 首页 ========== */
function statBox(v,l){return '<div class="stat"><b>'+v+'</b><span>'+l+'</span></div>'}
function renderDashboard(){
  const admin=isAdmin();
  const inToday=D.attendance.filter(a=>a.type==='IN'&&isToday(a.created_at));
  const visitsToday=D.visits.filter(v=>isToday(v.created_at));
  const gradeA=D.customers.filter(c=>c.grade==='A').length;
  const due=D.customers.filter(c=>c.follow_up&&c.follow_up<=ymd()).sort((a,b)=>a.follow_up.localeCompare(b.follow_up));
  let stats;
  if(admin){
    const sales=salesList(),checked=new Set(inToday.map(a=>a.user_id));
    stats=statBox(sales.length,'Sales 人数')+statBox(sales.filter(s=>checked.has(s.id)).length+' / '+sales.length,'今日已打卡')+
      statBox(visitsToday.length,'今日拜访')+statBox(D.customers.length,'客户总数')+statBox(gradeA,'A 级客户')+statBox(money(potentialFor()),'潜在订单');
  }else{
    stats=statBox(inToday.length?'已打卡':'未打卡','今日打卡')+statBox(visitsToday.length,'今日拜访')+
      statBox(D.customers.length,'我的客户')+statBox(gradeA,'A 级客户')+statBox(due.length,'待跟进')+statBox(money(potentialFor()),'潜在订单');
  }
  let h='<h2>📊 '+(admin?'管理首页':'我的首页')+'</h2>';
  if(!me.pwdChanged)h+='<div class="banner"><b>⚠️ 请先修改默认密码。</b>当前账号仍在使用初始密码，任何知道账号名的人都可能登录。请在页面最下方的「修改我的密码」修改。</div>';
  h+='<div class="grid">'+stats+'</div><p class="muted" style="margin:-4px 0 12px">潜在订单 = 各客户最近一次拜访所填金额之和。</p>';
  if(admin)h+=salesTable();
  h+='<div class="card"><h3>📅 待跟进客户</h3>'+(due.length?due.slice(0,15).map(c=>
    '<div class="item row between"><div><b>'+esc(c.name)+'</b> <span class="badge g-'+esc(c.grade)+'">'+esc(c.grade)+'</span><br><small class="red">跟进日期 '+esc(c.follow_up)+'</small>'+(admin?' <small class="muted">· '+esc(nameOf(c.owner_id))+'</small>':'')+'</div>'+
    '<button class="btn" onclick="visitForm(\''+esc(c.id)+'\')">拜访</button></div>').join(''):'<div class="muted">目前没有到期的跟进</div>')+'</div>';
  h+='<div class="card"><h3>🔒 修改我的密码</h3><input id="pw1" type="password" placeholder="新密码（至少 8 位）" autocomplete="new-password"><input id="pw2" type="password" placeholder="再输入一次新密码" autocomplete="new-password"><button class="btn" onclick="changePassword()">保存新密码</button></div>';
  $('dashboard').innerHTML=h;
}
function salesTable(){
  const rows=salesList().map(u=>{
    const ins=D.attendance.filter(a=>a.user_id===u.id&&a.type==='IN'&&isToday(a.created_at)).sort((a,b)=>a.created_at.localeCompare(b.created_at));
    const v=D.visits.filter(x=>x.sales_id===u.id&&isToday(x.created_at)).length;
    const c=D.customers.filter(x=>x.owner_id===u.id).length;
    return '<tr><td>'+esc(u.name)+'</td><td>'+(ins.length?'✅ '+ftime(ins[0].created_at):'—')+'</td><td>'+v+'</td><td>'+c+'</td><td>'+money(potentialFor(u.id))+'</td></tr>';
  }).join('');
  return '<div class="card"><h3>👨‍💼 Sales 今日情况</h3><div class="table"><table><tr><th>Sales</th><th>今日打卡</th><th>今日拜访</th><th>客户数</th><th>潜在订单</th></tr>'+rows+'</table></div></div>';
}
async function changePassword(){
  const a=$('pw1').value,b=$('pw2').value;
  if(a.length<8){toast('新密码至少 8 位');return}
  if(a!==b){toast('两次输入的密码不一致');return}
  if(a==='123456'){toast('不能继续使用 123456');return}
  await guard(async()=>{
    const {error}=await sb.auth.updateUser({password:a,data:{pwd_changed:true}});
    if(error)throw error;
    me.pwdChanged=true;toast('密码已修改，下次请用新密码登录');page(cur);
  });
}

/* ========== 打卡 ========== */
function getPos(timeout){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation)return rej({code:0});
    navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:timeout||12000,maximumAge:0});
  });
}
function geoMsg(e){return e&&e.code===1?'请允许网页使用定位权限':e&&e.code===2?'无法确定位置，请到信号好的地方重试':e&&e.code===3?'定位超时，请重试':'此浏览器不支持定位（需要 HTTPS 网址）'}
let ckDate=ymd();
function onDate(x,d){return ymd(new Date(x))===d}
function filterCheckin(){ckDate=$('ckDate').value||ymd();renderCheckinBody()}
function renderCheckin(){
  const custs=(isAdmin()?D.customers:D.customers.filter(c=>c.owner_id===me.id)).slice().sort((a,b)=>a.name.localeCompare(b.name));
  const custOpts='<option value="">（不选择客户）</option>'+custs.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>').join('');
  $('checkin').innerHTML='<h2>📍 外勤打卡</h2><div class="card">'+
    '<label>这次打卡是去拜访哪位客户？（可选）</label><select id="ckCust">'+custOpts+'</select>'+
    '<div class="row"><button class="btn" onclick="attend(\'IN\')">📍 CHECK IN</button><button class="btn secondary" onclick="attend(\'OUT\')">🏁 CHECK OUT</button></div>'+
    '<p class="muted">今日状态：'+(D.attendance.some(a=>a.user_id===me.id&&a.type==='IN'&&isToday(a.created_at))?'已 Check In':'尚未 Check In')+'。打卡会记录 GPS 位置，请在弹出的提示里选择「允许」。</p></div>'+
    '<div class="card"><div class="row between"><h3 style="margin:0">查看日期</h3><input id="ckDate" type="date" style="width:auto;margin:0" max="'+ymd()+'" value="'+ckDate+'" onchange="filterCheckin()"></div></div>'+
    '<div id="ckBody"></div>'+
    '<div class="card"><h3>导出打卡记录</h3><div class="row"><input id="exFrom" type="date" style="width:auto" max="'+ymd()+'" value="'+ymd(new Date(Date.now()-6*86400000))+'"><span class="muted">至</span><input id="exTo" type="date" style="width:auto" max="'+ymd()+'" value="'+ymd()+'"></div><button class="btn secondary full" onclick="exportAttendance()">⬇ 下载这段日期的打卡记录（CSV）</button><p class="muted">可用 Excel 打开。'+(isAdmin()?'导出全部 Sales 的记录。':'只导出我自己的记录。')+'</p></div>';
  renderCheckinBody();
}
function exportAttendance(){
  const from=$('exFrom').value,to=$('exTo').value;
  if(!from||!to){toast('请选择开始和结束日期');return}
  if(from>to){toast('开始日期不能晚于结束日期');return}
  const list=D.attendance.filter(a=>{const d=ymd(new Date(a.created_at));return d>=from&&d<=to}).slice().sort((a,b)=>a.created_at.localeCompare(b.created_at));
  if(!list.length){toast('这段日期没有打卡记录');return}
  const header=['Sales','类型','时间','客户','纬度','经度','精度(m)'];
  const rows=list.map(a=>[nameOf(a.user_id),a.type,fmt(a.created_at),custName(a.customer_id)||'',a.lat!=null?a.lat:'',a.lng!=null?a.lng:'',a.accuracy!=null?Math.round(a.accuracy):'']);
  const csvEsc=s=>{s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv='\uFEFF'+[header,...rows].map(r=>r.map(csvEsc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='AKAIDO-打卡记录-'+from+'_to_'+to+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  toast('已导出 '+list.length+' 条记录');
}

async function uploadCard(file){
  if(!file)return;
  if(!/^image\//.test(file.type||'')){toast('请选择图片文件');return}
  if(file.size>8*1024*1024){toast('图片不能超过 8MB');return}
  await guard(async()=>{
    toast('正在上传名片…');
    const ext=((file.name||'').split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path='cards/'+me.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
    const up=await sb.storage.from('business-cards').upload(path,file,{upsert:true,contentType:file.type||'image/jpeg'});
    if(up.error)throw up.error;
    const signed=await sb.storage.from('business-cards').createSignedUrl(path,3600);
    cardPath=path;
    cardPreview=(signed&&signed.data&&signed.data.signedUrl)||null;
    renderCardPreview();
    toast('名片已上传');
  });
}

async function saveCustomer(id){
  const name=$('c_name').value.trim();
  if(!name){toast('请输入客户名称');return}
  if(!$('c_phone').value.trim()&&!$('c_office').value.trim()){toast('电话和「未获取电话号码」至少选一个填');return}
  const row={name:name,contact:$('c_contact').value.trim(),phone:$('c_phone').value.trim(),office_no:$('c_office').value.trim()||null,grade:$('c_grade').value,address:$('c_addr').value.trim(),
    competitor:$('c_comp').value.trim(),products:$('c_prod').value.trim(),remarks:$('c_rem').value.trim(),follow_up:$('c_fu').value||null,card_photo:cardPath,payment_term:$('c_term').value,payment_method:$('c_pay').value,kow_hock:$('c_kh').value};
  if(isAdmin()&&$('c_owner'))row.owner_id=$('c_owner').value;
  await guard(async()=>{
    let r;
    if(id){r=await sb.from('customers').update(row).eq('id',id)}
    else{if(!row.owner_id)row.owner_id=me.id;r=await sb.from('customers').insert(row)}
    if(r.error)throw r.error;
    await loadAll();renderCustomers();toast('客户已保存');
  });
}
async function deleteCustomer(id){
  if(!confirm('确定删除这个客户？该客户的所有拜访记录也会一起删除，无法恢复。'))return;
  await guard(async()=>{
    const r=await sb.from('customers').delete().eq('id',id);
    if(r.error)throw r.error;
    await loadAll();renderCustomers();toast('客户已删除');
  });
}

async function saveVisit(cid){
  const pot=Number($('v_pot').value||0);
  if(!(pot>=0)){toast('潜在订单金额不正确');return}
  const wantGps=$('v_gps').checked;
  const prods=Array.prototype.slice.call(document.querySelectorAll('.vprod')).filter(el=>el.checked).map(el=>el.value).join(', ');
  const base={customer_id:cid,sales_id:me.id,met_owner:$('v_owner').value==='1',need:$('v_need').value.trim(),feedback:$('v_fb').value.trim(),
    competitor:$('v_comp').value.trim(),potential_order:pot,next_follow_up:$('v_fu').value||null,products_interest:prods||null};
  await guard(async()=>{
    let gpsFailed=false;
    if(wantGps){
      toast('正在获取位置…');
      try{const p=await getPos(8000);base.lat=p.coords.latitude;base.lng=p.coords.longitude}catch(e){gpsFailed=true}
    }
    const r=await sb.from('visits').insert(base);
    if(r.error)throw r.error;
    if(base.next_follow_up){
      const u=await sb.from('customers').update({follow_up:base.next_follow_up}).eq('id',cid);
      if(u.error)throw u.error;
    }
    await loadAll();renderVisits();
    toast(gpsFailed?'拜访已保存（未能取得 GPS 位置）':'拜访记录已保存');
  });
}

const klMin=x=>{const [h,m]=klHM(x).split(':').map(Number);return h*60+m};

/* 迟到 / 早退 / OT：规则用打卡当天的快照；休息日工时单独列出，不算 OT */
function calc(r){
  const o={late:0,early:0,ot:0,rest:0,worked:0,note:''},s=H.settings;
  if(!r.clock_in)return o;
  const a=klMin(r.clock_in);let b=null;
  if(r.clock_out){b=klMin(r.clock_out)+(klDate(r.clock_out)>r.work_date?1440:0);o.worked=Math.max(0,b-a)}
  const rule=r.sched_rule;
  if(!rule){o.note='未设置 Schedule';return o}
  if(rule==='OFF'){o.rest=o.worked;o.note='休息日';return o}
  const m=/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(rule);
  if(!m){o.note='规则格式错误';return o}
  const st=+m[1]*60+ +m[2],en=+m[3]*60+ +m[4];
  if(a-st>s.late_grace_min)o.late=a-st;
  if(b==null){if(r.work_date<klDate(Date.now()))o.note='忘记下班打卡';return o}
  if(b<en)o.early=en-b;
  else if(b-en>s.ot_grace_min){const u=s.ot_unit==='exact'?1:+s.ot_unit;o.ot=Math.floor((b-en-s.ot_grace_min)/u)*u}
  return o;
}

  }
  h+='<p class="muted">打卡需要拍照和定位，请在提示时选择「允许」。打卡时间以服务器为准。</p></div>';
  hrTimer=setInterval(()=>{const e=$('hrNow');if(e)e.textContent=klHM(Date.now())},20000);

}

/* ----- 拍照 + 定位 + 打卡 ----- */
async function camOpen(type){
  camType=type;camPos=null;
  openModal('<h3>'+(type==='in'?'上班':'下班')+'打卡</h3><video id="camV" autoplay playsinline muted style="width:100%;border-radius:10px;background:#000;transform:scaleX(-1)"></video><p id="camS" class="muted">正在启动摄像头和定位…</p><div class="row"><button id="camB" class="btn" disabled onclick="camShot()">📸 拍照并打卡</button><button class="btn secondary" onclick="closeModal()">取消</button></div>');
  try{cam=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640}},audio:false})}
  catch(e){if($('camS'))$('camS').textContent='无法打开摄像头：请允许相机权限（需要 HTTPS 网址）';return}
  if(!$('camV')){stopCam();return}
  $('camV').srcObject=cam;
  try{camPos=await getPos(15000)}catch(e){if($('camS'))$('camS').textContent='GPS 无法取得：'+geoMsg(e);return}
  if(!$('camS'))return;
  $('camS').textContent='定位精度约 '+Math.round(camPos.coords.accuracy)+' 米，可以拍照打卡';$('camB').disabled=false;
}
function camShot(){guard(async()=>{
  const v=$('camV'),c=document.createElement('canvas'),w=Math.min(640,v.videoWidth||640);
  c.width=w;c.height=Math.round(w*(v.videoHeight||480)/(v.videoWidth||640));c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.7));
  const path=me.id+'/'+klDate(Date.now())+'-'+Date.now()+'-'+camType+'.jpg';
  $('camS').textContent='上传中…';
  const up=await sb.storage.from('clock-selfies').upload(path,blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
  const {error}=await sb.rpc(camType==='in'?'hr_clock_in':'hr_clock_out',{p_lat:camPos.coords.latitude,p_lng:camPos.coords.longitude,p_accuracy:camPos.coords.accuracy,p_selfie:path});
  if(error){$('camS').textContent=hrErr(error.message);toast(hrErr(error.message));return}
  closeModal();await loadHR();renderHR();toast(camType==='in'?'上班打卡成功':'下班打卡成功');
})}

   '<div class="card"><h3>打卡地点</h3><div class="table"><table><tr><th>名称</th><th>坐标</th><th>半径</th><th>启用</th><th></th></tr>'+(rows||'<tr><td colspan="5" class="muted">还没有地点，目前不检查 GPS 围栏</td></tr>')+'</table></div><label>名称</label><input id="lc_n" placeholder="AKAIDO Office"><div class="row"><div style="flex:1"><label>纬度</label><input id="lc_a" inputmode="decimal"></div><div style="flex:1"><label>经度</label><input id="lc_o" inputmode="decimal"></div></div><label>半径（米，建议 100–200）</label><input id="lc_r" type="number" value="150"><div class="row"><button class="btn secondary" onclick="lcHere()">📍 用我现在的位置</button><button class="btn" onclick="lcAdd()">新增地点</button></div><p class="muted">人站在公司里点「用我现在的位置」最准确。</p></div>';
}
async function setSave(){await guard(async()=>{const r=await sb.from('hr_settings').update({ot_grace_min:Math.max(0,+$('st_g').value||0),ot_unit:$('st_u').value,late_grace_min:Math.max(0,+$('st_l').value||0),enforce_geofence:$('st_f').checked}).eq('id',1);if(r.error)throw r.error;await loadHR();renderHR();toast('设置已保存')})}
async function lcHere(){await guard(async()=>{toast('正在获取 GPS…');let p;try{p=await getPos(15000)}catch(e){toast('GPS 无法取得：'+geoMsg(e));return}$('lc_a').value=p.coords.latitude.toFixed(6);$('lc_o').value=p.coords.longitude.toFixed(6);toast('已填入，精度约 '+Math.round(p.coords.accuracy)+' 米')})}
async function lcAdd(){
  const row={name:$('lc_n').value.trim(),lat:parseFloat($('lc_a').value),lng:parseFloat($('lc_o').value),radius_m:parseInt($('lc_r').value,10)||150};
  if(!row.name||isNaN(row.lat)||isNaN(row.lng)){toast('请填写名称和坐标');return}
  await guard(async()=>{const r=await sb.from('hr_locations').insert(row);if(r.error)throw r.error;await loadHR();renderHR();toast('地点已新增')});
}
async function lcSet(id,patch){await guard(async()=>{const r=await sb.from('hr_locations').update(patch).eq('id',id);if(r.error)throw r.error;await loadHR();renderHR()})}
async function lcDel(id){if(!confirm('确定删除这个地点？'))return;await guard(async()=>{const r=await sb.from('hr_locations').delete().eq('id',id);if(r.error)throw r.error;await loadHR();renderHR()})}

/* ========== 启动 ========== */
(async function init(){
  ['lu','lp'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()}));
  if(!window.supabase){loginMsg('无法加载网络组件，请检查网络后刷新页面');return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&me){me=null;location.reload()}});
  try{
    const {data}=await sb.auth.getSession();
    if(data&&data.session)await enter(data.session.user);
  }catch(e){console.error(e);loginMsg('自动登录失败，请重新登录')}
})();
</script>
</body>
