function buildPV(){const el=$('pvb');el.innerHTML='';for(const t of['red','gold','purple','blue']){const its=prizes.filter(p=>p.tier==t).sort((a,b)=>b.cells-a.cells);if(!its.length)continue;

  for(let i=0;i<w;i++)for(let j=0;j<hh;j++)used.add((gx+i)+','+(gy+j));rows=Math.max(rows,gy+hh);h+=`<div class="it" style="left:${gx*72}px;top:${gy*72}px;width:${w*72-4}px;height:${hh*72-4}px;border-color:${TIERS[t].c}"><img src="${p.image}"><span>${p.name}</span></div>`}
